name: ci

on:
  push:
    branches:
      - main
jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-versions: ["8.2", "8.3", "8.4", "8.5", "8.6"]
    name: PHP ${{ matrix.php-versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}

      - name: Install dependencies
        run: composer install

      - name: Run tests
        run: composer test

  no-mbstring:
    runs-on: ubuntu-latest
    name: PHP 8.6 without ext-mbstring
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.6"
          extensions: :mbstring

      - name: Install dependencies
        run: composer install

      # Pint needs ext-mbstring, so lint runs only in the jobs above
      - name: Run tests
        run: composer test:no-mbstring
